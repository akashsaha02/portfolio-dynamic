name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally; npm 10 and 11 disagree on optional peer entries in the lockfile.
      - name: Use npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps are generated; a fresh checkout needs typegen first.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      # Runs once task 0.4 adds the Vitest config.
      - name: Unit tests
        if: hashFiles('vitest.config.ts') != ''
        run: npm test

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npx next build

  e2e:
    name: E2E (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Runs only once task 0.4 adds the Playwright config.
      # hashFiles() is not allowed in job-level `if`, so gate each step on this output.
      - name: Check for Playwright config
        id: has-pw
        run: echo "present=${{ hashFiles('playwright.config.ts') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.has-pw.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally; npm 10 and 11 disagree on optional peer entries in the lockfile.
      - name: Use npm 11
        if: steps.has-pw.outputs.present == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.has-pw.outputs.present == 'true'
        run: npm ci

      - name: Get Playwright version
        if: steps.has-pw.outputs.present == 'true'
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.has-pw.outputs.present == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers and system deps
        if: steps.has-pw.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps only (browser cache hit)
        if: steps.has-pw.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Cache Next.js build cache
        if: steps.has-pw.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: E2E tests
        if: steps.has-pw.outputs.present == 'true'
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure() && steps.has-pw.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI (mobile, warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally; npm 10 and 11 disagree on optional peer entries in the lockfile.
      - name: Use npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-lh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-lh-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npx next build

      # lighthouserc.json starts `next start` on port 3400 and runs 3 mobile passes.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
